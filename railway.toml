# Railway configuration for Immanuel
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m immanuel.main"
restartPolicyType = "always"
restartPolicyMaxRetries = 10

# The process binds a FastAPI server to $PORT (Railway sets this automatically),
# which also serves as the HTTP healthcheck target. The Discord bot and the 24/7
# crawler run as background tasks in the same process.
[deploy.healthcheck]
path = "/health"
timeout = 30
